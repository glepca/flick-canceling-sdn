[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flick-canceling"
version = "0.1.0"
description = "Correção localizada de cintilação em sequências de imagens"
requires-python = ">=3.10"
license = "Apache-2.0"
dynamic = ["dependencies"]

[project.scripts]
flick = "flick.cli:main"

[tool.setuptools]
packages = ["flick"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
flick = ["receita.json"]
