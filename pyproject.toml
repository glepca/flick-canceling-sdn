[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flick-canceling"
version = "0.1.0"
description = "Localized flicker canceling for image sequences, by Smart Diseños (SDÑ)"
readme = "README.md"
authors = [{name = "Smart Diseños (SDÑ)"}]
requires-python = ">=3.12"
license = "Apache-2.0"
dynamic = ["dependencies"]

[project.scripts]
flick = "flick.cli:main"

[tool.setuptools]
packages = ["flick"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
flick = ["receita.json"]
